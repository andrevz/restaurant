<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Grupos</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="group-editor-header">
        <nav class="group-editor-header__nav">
            <img src="/images/logo.png" alt="Logo de la aplicación">
        </nav>
    </header>

    <main class="group-editor-container">
        <h1 class="group-editor-container__title">Editar Grupo</h1>

        <form class="group-editor-form">
            <fieldset class="group-editor-form__section group-editor-form__general">
                <legend class="group-editor-form__legend">Información General</legend>

                <div class="form__input">
                    <label for="name">Nombre del grupo:</label>
                    <input type="text" id="name" name="name" autocomplete="off" autofocus required>
                </div>
            </fieldset>

            <fieldset class="group-editor-form__section group-editor-form__pricing">
                <legend class="group-editor-form__legend">Matriz de Precios</legend>

                <div class="group-editor-form__header" aria-hidden="true">
                    <span>Tamaño</span>
                    <span>Unidad</span>
                    <span>Precio</span>
                </div>

                <div class="group-editor-form__row">
                    <span>4</span>
                    <span>Porciones</span>
                    <div class="form__input">
                        <label for="price-4">Precio para 4 porciones</label>
                        <input type="number" id="price-4" name="price-4" min="0" step="0.01" required>
                    </div>
                </div>

                <div class="group-editor-form__row">
                    <span>6</span>
                    <span>Porciones</span>
                    <div class="form__input">
                        <label for="price-6">Precio para 6 porciones</label>
                        <input type="number" id="price-6" name="price-6" min="0" step="0.01" required>
                    </div>
                </div>

                <div class="group-editor-form__row">
                    <span>8</span>
                    <span>Porciones</span>
                    <div class="form__input">
                        <label for="price-8">Precio para 8 porciones</label>
                        <input type="number" id="price-8" name="price-8" min="0" step="0.01" required>
                    </div>
                </div>

                <div class="group-editor-form__row">
                    <span>10</span>
                    <span>Porciones</span>
                    <div class="form__input">
                        <label for="price-10">Precio para 10 porciones</label>
                        <input type="number" id="price-10" name="price-10" min="0" step="0.01" required>
                    </div>
                </div>
            </fieldset>
            <div class="group-editor-form__actions">
                <button class="group-editor-form__button group-editor-form__button--submit" type="submit">Guardar</button>
                <button class="group-editor-form__button group-editor-form__button--cancel" type="button">Cancelar</button>
            </div>
        </form>
    </main>
</body>
</html>
